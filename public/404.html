<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LORÉA — Luxury Women's Fashion</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current URL and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new URL with only a query string and hash fragment,
      // e.g. https://foo.github.io/bar/one/two?a=b#c becomes
      // https://foo.github.io/bar/?/one/two&a=b#c
      
      // If deployed to a GitHub Pages project URL (e.g. username.github.io/repo-name),
      // pathSegmentsToKeep is 1. If deployed to a custom domain (e.g. lorea-couture.com),
      // pathSegmentsToKeep is 0.
      var isGithubProject = window.location.hostname.endsWith('github.io');
      var pathSegmentsToKeep = isGithubProject ? 1 : 0;

      var l = window.location;
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;

      l.replace(redirectUrl);
    </script>
  </head>
  <body style="background-color: #F7F4EF; color: #1D1D1B; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p style="letter-spacing: 0.1em; text-transform: uppercase; font-size: 13px;">Redirecting to LORÉA Atelier...</p>
  </body>
</html>
