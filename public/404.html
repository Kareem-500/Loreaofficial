<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LORÉA — Luxury Women's Fashion</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      var isGithub = window.location.hostname.endsWith('github.io');
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      var knownRoutes = [
        'shop', 'store', 'new-in', 'sale', 'collection', 'collections',
        'product', 'search', 'wishlist', 'account', 'cart', 'checkout',
        'story', 'about', 'journal', 'contact', 'shipping', 'returns',
        'faq', 'admin'
      ];

      // If on *.github.io and the first path segment is NOT a known route, it's the repo name
      var pathSegmentsToKeep = (isGithub && pathSegments.length > 0 && !knownRoutes.includes(pathSegments[0].toLowerCase())) ? 1 : 0;

      var l = window.location;
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;

      l.replace(redirectUrl);
    </script>
  </head>
  <body style="background-color: #F7F4EF; color: #1D1D1B; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p style="letter-spacing: 0.1em; text-transform: uppercase; font-size: 13px;">Redirecting to LORÉA Atelier...</p>
  </body>
</html>
